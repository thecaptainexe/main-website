name: Testimonial
description: Share positive feedback about CaptainEXE's work.
title: "[Testimonial] "
labels:
  - pending
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing feedback about CaptainEXE's work.

        Testimonials are for people who have used a CaptainEXE product or worked directly with CaptainEXE.
        Please write plain text only: do not use Markdown, links, images, code, or formatting.
        Keep it respectful, factual, and safe to publish. Submissions are reviewed before appearing on the website.

  - type: input
    id: name
    attributes:
      label: Name
      description: Your name or public handle.
      placeholder: "e.g. Alex"
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role or relationship
      description: Optional context such as collaborator, client, teammate, or community member.
      placeholder: "e.g. Client"

  - type: textarea
    id: testimonial
    attributes:
      label: Testimonial
      description: Share a brief plain-text endorsement based on using a product or working with CaptainEXE. Do not use Markdown.
      placeholder: "I worked with CaptainEXE on..."
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      description: By submitting, you confirm that the testimonial may be publicly displayed after review.
      options:
        - label: I understand that my testimonial may be reviewed before publication.
          required: true
